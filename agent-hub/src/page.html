<title>Agent Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: an operations floor. Sticky shift bar, inbox of what needs the manager, then the team floor, the scheduled crew and the standup desk. Phone first, one column; a grid on wide screens. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --line: #d9dee7;
  --fg: #141a24;
  --muted: #5b6577;
  --accent: #2f55d4;
  --accent-fg: #ffffff;
  --failed: #c4362b;
  --blocked: #b86a00;
  --review: #7a3fc4;
  --working: #1b7f6b;
  --done: #6a7487;
  --failed-bg: #fbe9e7;
  --blocked-bg: #fdf0dc;
  --review-bg: #f1e8fb;
  --working-bg: #e2f3ef;
  --done-bg: #eceff4;
  --shadow: 0 1px 2px rgba(20, 26, 36, .06), 0 4px 16px rgba(20, 26, 36, .05);
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #161b23; --surface-2: #1d2430; --line: #2a3240;
    --fg: #e8ecf3; --muted: #97a1b3; --accent: #7d9bff; --accent-fg: #0e1218;
    --failed: #ff7b6e; --blocked: #f0a73c; --review: #b68cf5; --working: #4fd1b2; --done: #8b95a8;
    --failed-bg: #3a1c1a; --blocked-bg: #352712; --review-bg: #2a1f3d; --working-bg: #12302a; --done-bg: #222a36;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #161b23; --surface-2: #1d2430; --line: #2a3240;
  --fg: #e8ecf3; --muted: #97a1b3; --accent: #7d9bff; --accent-fg: #0e1218;
  --failed: #ff7b6e; --blocked: #f0a73c; --review: #b68cf5; --working: #4fd1b2; --done: #8b95a8;
  --failed-bg: #3a1c1a; --blocked-bg: #352712; --review-bg: #2a1f3d; --working-bg: #12302a; --done-bg: #222a36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }

/* Header */
#hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; padding-block: 14px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
#hdr h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; }
#updated { color: var(--muted); font-size: 13px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; font-size: 14px; font-weight: 500; min-height: 36px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--failed); }
.btn.danger.solid { background: var(--failed); color: var(--surface); border-color: var(--failed); }
.btn[disabled] { opacity: .55; cursor: default; }

/* Notices */
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--fg); }
.inline-note { font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); margin: 0; padding: 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.count { font-family: var(--font-body); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 1px 8px; font-size: 12px; letter-spacing: 0; }

/* Status pill */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-failed { color: var(--failed); background: var(--failed-bg); }
.s-blocked { color: var(--blocked); background: var(--blocked-bg); }
.s-review { color: var(--review); background: var(--review-bg); }
.s-working { color: var(--working); background: var(--working-bg); }
.s-done, .s-unknown, .s-archived { color: var(--done); background: var(--done-bg); }
.s-working::before { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .s-working::before { animation: none; } }

/* Needs-you inbox */
.inbox { display: flex; flex-direction: column; gap: 8px; }
.inbox-item {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px 12px 0; text-align: left; width: 100%; box-shadow: var(--shadow);
}
.inbox-item .stripe { align-self: stretch; border-radius: 0 3px 3px 0; }
.inbox-item.s-failed .stripe { background: var(--failed); }
.inbox-item.s-blocked .stripe { background: var(--blocked); }
.inbox-item.s-review .stripe { background: var(--review); }
.inbox-item { color: var(--fg); background: var(--surface); }
.inbox-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.inbox-title { font-weight: 600; overflow-wrap: anywhere; }
.inbox-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.when { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* Summary chips */
#summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.chip b { font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* Team board */
.team-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
#board { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { #board { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); } }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; min-width: 0; color: var(--fg);
}
.card:hover { border-color: var(--muted); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.where { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: auto; }
.card-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.card-summary { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

/* Crew */
.crew-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.crew-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crew-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.crew-about { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; overflow-wrap: anywhere; }
.crew-report { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; overflow-wrap: anywhere; color: var(--muted); }
.crew-report.flagged { color: var(--fg); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ok { color: var(--working); } .bad { color: var(--failed); }

/* Standup */
#standup-out { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; max-width: 70ch; }

/* Detail sheet */
#sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 20; }
#sheet {
  position: fixed; z-index: 21; background: var(--surface); color: var(--fg);
  inset: auto 0 0 0; max-height: 88%; border-radius: 16px 16px 0 0;
  overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow);
}
@media (min-width: 760px) {
  #sheet { inset: 0 0 0 auto; width: 460px; max-height: none; border-radius: 0; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
}
.sheet-head { display: flex; gap: 12px; align-items: flex-start; }
.sheet-head h3 { font-size: 20px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.turns { display: flex; flex-direction: column; gap: 10px; }
.turn { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.turn.you { border-color: var(--accent); }
.turn.end { border-color: var(--done); color: var(--muted); font-size: 13px; }
.turn-who { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.turn-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
textarea { width: 100%; min-height: 84px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.helpers { margin: 0; padding-left: 18px; }
</style>

<div class="wrap">
  <header id="hdr">
    <h1>Agent Hub</h1>
    <span id="updated" aria-live="polite">Connecting…</span>
    <button id="refresh" class="btn" type="button">Refresh</button>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <section id="needs" aria-labelledby="needs-h">
    <h2 id="needs-h">Needs you <span id="needs-count" class="count">0</span></h2>
    <div id="needs-list" class="inbox"></div>
    <p id="needs-empty" class="empty" hidden>Nothing needs you right now. Agents that are waiting on you, failed, or ready for review show up here.</p>
  </section>

  <section id="team" aria-labelledby="team-h">
    <div class="team-head">
      <h2 id="team-h">Team</h2>
      <label class="toggle"><input type="checkbox" id="show-archived"> Show archived</label>
    </div>
    <nav id="summary" aria-label="Filter by status"></nav>
    <p id="board-note" class="inline-note" hidden></p>
    <div id="board"></div>
    <p id="board-empty" class="empty" hidden>No agents yet. Start a Claude Code session and it shows up here.</p>
  </section>

  <section id="crew" aria-labelledby="crew-h">
    <h2 id="crew-h">Scheduled</h2>
    <p id="crew-note" class="inline-note" hidden></p>
    <div id="crew-list" class="inbox"></div>
    <p id="crew-empty" class="empty" hidden>No scheduled tasks.</p>
  </section>

  <section id="standup" aria-labelledby="standup-h">
    <h2 id="standup-h">Standup</h2>
    <div class="actions">
      <button id="standup-btn" class="btn primary" type="button">Write today's standup</button>
      <span id="standup-note" class="inline-note"></span>
    </div>
    <div id="standup-out" hidden></div>
  </section>
</div>

<div id="sheet-backdrop" hidden></div>
<aside id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></aside>

<!--LOGIC-->
<!--APP-->
